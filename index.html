<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f1a16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>ถ่ายขาย — ถ่ายรูป แล้วลงขาย</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Kanit:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <!-- CAMERA SCREEN -->
      <section id="screen-camera" class="screen screen-camera is-active" aria-label="กล้องถ่ายรูป">
        <header class="camera-top">
          <p class="brand">ถ่ายขาย</p>
          <button type="button" class="ghost-btn" id="btn-open-listings" aria-label="ดูรายการขาย">
            ของฉัน
            <span class="badge" id="listing-count">0</span>
          </button>
        </header>

        <div class="viewfinder" id="viewfinder">
          <video id="camera" autoplay playsinline muted></video>
          <canvas id="capture-canvas" hidden></canvas>
          <div class="viewfinder-frame" aria-hidden="true"></div>
          <p class="viewfinder-hint" id="camera-hint">กำลังเปิดกล้อง…</p>
          <div class="shutter-flash" id="shutter-flash" aria-hidden="true"></div>
        </div>

        <footer class="camera-dock">
          <button type="button" class="dock-side" id="btn-pick-file" aria-label="เลือกรูปจากเครื่อง">
            <span class="dock-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="3" y="5" width="18" height="14" rx="2" />
                <circle cx="8.5" cy="10" r="1.5" />
                <path d="M21 16l-5.5-5.5L9 17" />
              </svg>
            </span>
            แกลเลอรี
          </button>

          <button type="button" class="shutter" id="btn-shutter" aria-label="ถ่ายรูป">
            <span class="shutter-ring"></span>
            <span class="shutter-core"></span>
          </button>

          <button type="button" class="dock-side" id="btn-flip" aria-label="สลับกล้อง">
            <span class="dock-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M16 7h4v4" />
                <path d="M20 7l-3.5 3.5A6.5 6.5 0 0 1 6 14" />
                <path d="M8 17H4v-4" />
                <path d="M4 17l3.5-3.5A6.5 6.5 0 0 1 18 10" />
              </svg>
            </span>
            สลับ
          </button>
        </footer>

        <input
          type="file"
          id="file-input"
          accept="image/*"
          capture="environment"
          hidden
        />
      </section>

      <!-- REVIEW / LIST SCREEN -->
      <section id="screen-review" class="screen screen-review" aria-label="พรีวิวและลงขาย" hidden>
        <header class="panel-header">
          <button type="button" class="text-btn" id="btn-retake">ถ่ายใหม่</button>
          <h1>ลงขาย</h1>
          <span class="header-spacer"></span>
        </header>

        <div class="review-photo-wrap">
          <img id="review-photo" alt="รูปที่ถ่าย" />
        </div>

        <form id="sell-form" class="sell-form" autocomplete="off">
          <label>
            ชื่อสินค้า
            <input
              type="text"
              id="item-title"
              name="title"
              maxlength="80"
              placeholder="เช่น กล้องฟิล์มมือสอง"
              required
            />
          </label>
          <label>
            ราคา (บาท)
            <input
              type="number"
              id="item-price"
              name="price"
              min="1"
              step="1"
              placeholder="เช่น 450"
              required
            />
          </label>
          <label>
            รายละเอียดสั้นๆ
            <textarea
              id="item-note"
              name="note"
              rows="2"
              maxlength="160"
              placeholder="สภาพสินค้า / วิธีติดต่อ"
            ></textarea>
          </label>
          <button type="submit" class="primary-btn" id="btn-list">ลงขายเลย</button>
        </form>
      </section>

      <!-- LISTINGS SCREEN -->
      <section id="screen-listings" class="screen screen-listings" aria-label="รายการขายของฉัน" hidden>
        <header class="panel-header">
          <button type="button" class="text-btn" id="btn-back-camera">กล้อง</button>
          <h1>ของฉัน</h1>
          <span class="header-spacer"></span>
        </header>

        <div id="listings-empty" class="empty-state" hidden>
          <p class="empty-title">ยังไม่มีสินค้า</p>
          <p class="empty-copy">ถ่ายรูปชิ้นแรก แล้วลงขายได้เลย</p>
          <button type="button" class="primary-btn" id="btn-empty-shoot">เปิดกล้อง</button>
        </div>

        <ul id="listings" class="listings"></ul>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
